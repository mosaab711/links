<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُصْعَب</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- Background Video -->
<video autoplay muted loop playsinline id="bg-video">
    <source src="batman1.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- Start Screen -->
<div id="startOverlay">

    <div class="enter-box">

        <h1>ENTER</h1>

        <p>Click Anywhere</p>

    </div>

</div>

<!-- Phone -->
<div class="phone">

<div class="container" id="mainContent">

<div class="profile-glow">

<img src="profile.png" class="profile">

</div>

<h1>مُصْعَب</h1>

<p class="bio">
Batman • Berserk • Developer
</p>

<div class="links">

<a href="https://www.tiktok.com/@mos3aab_0"
class="icon-link">

<i class="fab fa-tiktok"></i>

</a>

<a href="https://discord.com/users/mosvvb"
class="icon-link">

<i class="fab fa-discord"></i>

</a>

<a href="https://open.spotify.com/user/31hyg2gqwtyb6j4nj25oyxjwyaly"
class="icon-link">

<i class="fab fa-spotify"></i>

</a>

</div>

<div class="sound-control">

<i id="soundIcon"
class="fas fa-volume-up"></i>

<input
type="range"
id="volumeSlider"
min="0"
max="100"
value="70">

</div>

<div class="credit">

Made with ❤️ by Mosaab

</div>

</div>

</div>

<audio
id="myAudio"
src="theneighbourhood.mp3"
loop>
</audio>

<script>

const audio=document.getElementById("myAudio");

const startOverlay=document.getElementById("startOverlay");

const mainContent=document.getElementById("mainContent");

const soundIcon=document.getElementById("soundIcon");

const volumeSlider=document.getElementById("volumeSlider");

let muted=false;

startOverlay.onclick=()=>{

startOverlay.style.display="none";

mainContent.style.display="flex";

audio.currentTime=115;

audio.volume=.7;

audio.play();

};

document.body.onclick=()=>{

if(audio.paused&&startOverlay.style.display=="none"){

audio.play();

}

};

volumeSlider.oninput=(e)=>{

audio.volume=e.target.value/100;

};

soundIcon.onclick=()=>{

muted=!muted;

audio.muted=muted;

soundIcon.className=
muted
?
"fas fa-volume-mute"
:
"fas fa-volume-up";

};

</script>

</body>
</html>
